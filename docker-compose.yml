services:

  redis:
    image: redis:7-alpine
    container_name: idp-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - idp-redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - idp-network

  postgres:
    image: postgres:16-alpine
    container_name: idp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: idp
      POSTGRES_USER: idp
      POSTGRES_PASSWORD: idp
    volumes:
      - idp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U idp -d idp
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - idp-network

  event-platform:
    build:
      context: ./services/event-platform
    container_name: idp-event-platform
    restart: unless-stopped
    ports:
      - "8007:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      EVENT_STREAM: idp-events
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - idp-network

  policy-engine:
    build:
      context: ./services/policy-engine
    container_name: idp-policy-engine
    restart: unless-stopped
    ports:
      - "8006:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - idp-network

  service-catalog:
    build:
      context: ./services/service-catalog
    container_name: idp-service-catalog
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://idp:idp@postgres:5432/idp
      EVENT_PLATFORM_URL: http://event-platform:8000
    depends_on:
      postgres:
        condition: service_healthy
      event-platform:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - idp-network

  template-engine:
    build:
      context: ./services/template-engine
    container_name: idp-template-engine
    restart: unless-stopped
    ports:
      - "8002:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - idp-network

  workflow-engine:
    build:
      context: ./services/workflow-engine
    container_name: idp-workflow-engine
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://idp:idp@postgres:5432/idp
      EVENT_PLATFORM_URL: http://event-platform:8000
    depends_on:
      postgres:
        condition: service_healthy
      event-platform:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - idp-network

  identity-service:
    build:
      context: ./services/identity-service
    container_name: idp-identity-service
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://idp:idp@postgres:5432/idp
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      ACCESS_TOKEN_MINUTES: 60
      REFRESH_TOKEN_DAYS: 7
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - idp-network

  developer-portal-api:
    build:
      context: ./services/developer-portal-api
    container_name: idp-developer-portal-api
    restart: unless-stopped
    ports:
      - "8004:8000"
    environment:
      PLATFORM_API_URL: http://platform-api:8000
      CATALOG_URL: http://service-catalog:8000
      WORKFLOW_URL: http://workflow-engine:8000
      IDENTITY_URL: http://identity-service:8000
      TEMPLATE_URL: http://template-engine:8000
      POLICY_URL: http://policy-engine:8000
      EVENT_URL: http://event-platform:8000
    depends_on:
      service-catalog:
        condition: service_healthy
      workflow-engine:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      template-engine:
        condition: service_healthy
      policy-engine:
        condition: service_healthy
      event-platform:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - idp-network

  platform-api:
    build:
      context: ./services/platform-api
    container_name: idp-platform-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POLICY_ENGINE_URL: http://policy-engine:8000
      CATALOG_URL: http://service-catalog:8000
      WORKFLOW_ENGINE_URL: http://workflow-engine:8000
      TEMPLATE_ENGINE_URL: http://template-engine:8000
      EVENT_PLATFORM_URL: http://event-platform:8000
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
    depends_on:
      policy-engine:
        condition: service_healthy
      service-catalog:
        condition: service_healthy
      workflow-engine:
        condition: service_healthy
      template-engine:
        condition: service_healthy
      event-platform:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - idp-network


  developer-portal:
    build:
      context: ./developer-portal/frontend
    container_name: idp-developer-portal
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      developer-portal-api:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - "-"
        - http://localhost/healthz
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - idp-network

networks:
  idp-network:
    name: idp-network

volumes:
  idp-postgres-data:
    name: idp-postgres-data

  idp-redis-data:
    name: idp-redis-data





