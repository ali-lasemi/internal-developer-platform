apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: internal-platform-root
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ali-lasemi/internal-developer-platform.git
    targetRevision: main
    path: platform/kubernetes/base

  destination:
    server: https://kubernetes.default.svc
    namespace: platform-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
