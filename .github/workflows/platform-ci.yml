name: Platform CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  validate:
    name: Validate Platform Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository Validation
        run: |
          echo "Validating Internal Developer Platform structure"
          test -d platform
          test -d docs
          test -d automation

      - name: Success
        run: echo "Platform validation completed"
